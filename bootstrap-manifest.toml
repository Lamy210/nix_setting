# bootstrap-manifest.toml — Managed Nix provider pin (design.md D3)
#
# この file は SchneeForge Core が source of truth として扱う。
# SHA256 は upstream `https://github.com/NixOS/nix-installer/releases/download/{version}/SHA256SUMS`
# から取得され、`.github/workflows/upstream-nix-installer.yml` が release cycle 毎に bump する。
#
# runtime はこの manifest の sha256 と download binary の実測を比較して検証する。
# (SLSA provenance は CI 側でのみ検証、利用者 PC は sha256 比較のみで保護)

[managed_nix]
version = "2.35.4"

[managed_nix.sha256_by_arch]
x86_64-linux = "60f39200fc2690bcf4da7ba3f8b2e4dee0118f487bc9f41cd4e153d1a02dce77"
aarch64-linux = "4f02039533e0912cb5e6f819a2abcac87d78e19b76e377c2ee98e5ec10402341"
aarch64-darwin = "42cb8b257ace0bce5a5ee0d5bc36af47a6887004c00e8801940112c6e37beca3"
