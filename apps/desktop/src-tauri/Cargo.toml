[package]
name = "schneeforge-desktop"
version = "0.2.0-rc.1"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "schneeforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
schneeforge-core = { path = "../../../crates/core" }
