<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchneeForge</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <h1>❄ SchneeForge</h1>
    <div class="card" id="status">
      <div class="row"><span class="key">host</span><span class="val" id="host">-</span></div>
      <div class="row"><span class="key">user</span><span class="val" id="user">-</span></div>
      <div class="row"><span class="key">nix</span><span class="val" id="nix">-</span></div>
      <div class="row"><span class="key">homebrew</span><span class="val" id="homebrew">-</span></div>
      <div class="row"><span class="key">applied</span><span class="val" id="applied">-</span></div>
    </div>

    <div class="actions">
      <button id="refresh">更新</button>
      <button id="scan">スキャン</button>
      <button id="apply">適用</button>
      <button id="rollback" class="danger">ロールバック</button>
      <button id="upgrade">アップグレード</button>
    </div>

    <div class="running-bar" id="running">
      <div class="spinner"></div>
      <span id="running-text">実行中...</span>
    </div>

    <div class="card">
      <pre id="output">出力はここに表示されます</pre>
    </div>

    <script src="main.js"></script>
  </body>
</html>
