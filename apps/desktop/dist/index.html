<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchneeForge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 1.5rem;
      }
      .card {
        background: #1e293b;
        border-radius: 0.75rem;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 0.35rem 0;
      }
      .row .key {
        color: #94a3b8;
      }
      .row .val {
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      button {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        cursor: pointer;
      }
      button.danger {
        background: #f87171;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      pre {
        background: #0f172a;
        border-radius: 0.75rem;
        padding: 1rem;
        overflow: auto;
        font-size: 0.85rem;
        white-space: pre-wrap;
        min-height: 8rem;
      }
    </style>
  </head>
  <body>
    <h1>❄ SchneeForge</h1>
    <div class="card" id="status">
      <div class="row"><span class="key">host</span><span class="val" id="host">-</span></div>
      <div class="row"><span class="key">user</span><span class="val" id="user">-</span></div>
      <div class="row"><span class="key">nix</span><span class="val" id="nix">-</span></div>
      <div class="row"><span class="key">homebrew</span><span class="val" id="homebrew">-</span></div>
      <div class="row"><span class="key">applied</span><span class="val" id="applied">-</span></div>
    </div>

    <div class="actions">
      <button id="refresh">更新</button>
      <button id="scan">スキャン</button>
      <button id="apply">適用</button>
      <button id="rollback" class="danger">ロールバック</button>
      <button id="upgrade">アップグレード</button>
    </div>

    <div class="card">
      <pre id="output">出力はここに表示されます</pre>
    </div>

    <script>
      const { invoke } = window.__TAURI__.core;

      const $ = (id) => document.getElementById(id);

      async function refresh() {
        const s = await invoke("get_status");
        $("host").textContent = s.host;
        $("user").textContent = s.user ?? "-";
        $("nix").textContent = s.nix ? "yes" : "no";
        $("homebrew").textContent = s.homebrew ? "yes" : "no";
        $("applied").textContent = s.applied_revision ?? "(never)";
      }

      async function run(fn, name) {
        const btn = $(name);
        btn.disabled = true;
        $("output").textContent = `running ${name}...`;
        try {
          const r = await fn();
          $("output").textContent = r.output;
        } catch (e) {
          $("output").textContent = String(e);
        } finally {
          btn.disabled = false;
          refresh();
        }
      }

      $("refresh").addEventListener("click", refresh);
      $("scan").addEventListener("click", () => run(() => invoke("run_scan"), "scan"));
      $("apply").addEventListener("click", () => run(() => invoke("run_apply"), "apply"));
      $("rollback").addEventListener("click", () => run(() => invoke("run_rollback"), "rollback"));
      $("upgrade").addEventListener("click", () => run(() => invoke("run_upgrade"), "upgrade"));

      refresh();
    </script>
  </body>
</html>
