<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchneeForge</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <h1>❄ SchneeForge</h1>

    <div id="ready-view">
      <div class="card" id="dashboard">
        <h2>Dashboard</h2>
        <div class="row"><span class="key">installed</span><span class="val" id="dash-installed">-</span></div>
        <div class="row"><span class="key">profile</span><span class="val" id="dash-profile">-</span></div>
        <div class="row"><span class="key">channel</span><span class="val" id="dash-channel">-</span></div>
        <div class="row"><span class="key">available</span><span class="val" id="dash-available">-</span></div>
        <p class="note" id="dash-update"></p>
        <div class="row">
          <span class="key">profile 切替</span>
          <span class="val">
            <select id="dash-profile-select"></select>
            <button id="profile-set">適用</button>
            <button id="profile-clear">既定へ</button>
          </span>
        </div>
        <p class="note" id="profile-note"></p>
      </div>

      <div class="card" id="status">
        <div class="row"><span class="key">host</span><span class="val" id="host">-</span></div>
        <div class="row"><span class="key">profile</span><span class="val" id="profile">-</span></div>
        <div class="row"><span class="key">nix</span><span class="val" id="nix">-</span></div>
        <div class="row"><span class="key">homebrew</span><span class="val" id="homebrew">-</span></div>
        <div class="row"><span class="key">applied</span><span class="val" id="applied">-</span></div>
      </div>

      <div class="actions">
        <button id="refresh">更新</button>
        <button id="scan">スキャン</button>
        <button id="plan">プラン</button>
        <button id="apply">適用</button>
        <button id="rollback" class="danger">ロールバック</button>
        <button id="upgrade">アップグレード</button>
        <button id="verify">検証</button>
        <button id="nix-uninstall" class="danger">Nix を削除...</button>
      </div>

      <div class="running-bar" id="running">
        <div class="spinner"></div>
        <span id="running-text">実行中...</span>
      </div>

      <div class="card">
        <pre id="output">出力はここに表示されます</pre>
      </div>
    </div>

    <div id="setup-view" class="hidden">
      <div class="card">
        <h2>Set up SchneeForge</h2>
        <p>このマシンにはまだ設定がありません。ウィザードに従ってセットアップしてください。</p>
      </div>
      <div class="card" id="setup-step"></div>
      <div class="actions" id="setup-actions"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
