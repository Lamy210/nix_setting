pre-commit:
  parallel: true
  commands:
    format:
      run: nix fmt
    statix:
      glob: "*.nix"
      run: statix check {staged_files}
    deadnix:
      glob: "*.nix"
      run: deadnix --fail {staged_files}
    secret-scan:
      run: bash -c '! grep -RInE "(token|password|apikey|api_key|BEGIN.*(OPENSSH|RSA|DSA|EC))" . --exclude-dir=.git --exclude-dir=.github --exclude=docs/*.md --exclude=lefthook.yml'
