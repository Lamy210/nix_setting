# Dependency updates run against the default branch (develop).
# Security updates need Dependabot alerts + security updates enabled in repo settings.
# Keep security fixes individually reviewable; group only routine patch version updates.
# Nix flakes deliberately remain under .github/workflows/update.yml until #240
# (GitHub Actions PR creation policy) is resolved and template locks are audited.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      cargo-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  # Independent Tauri workspace/lockfile. Do not mix it into CLI updates.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      desktop-cargo-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      actions-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
