name: Windows WSL2 canary

on:
  push:
    branches: [develop]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/windows-wsl-canary.yml"
      - "tests/fixtures/wsl-download-smoke.sh"
      - "bootstrap-manifest.toml"

permissions:
  contents: read

concurrency:
  group: windows-wsl-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-transport:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: windows-wsl-canary

      - name: Build native Windows launcher
        shell: pwsh
        run: cargo build -p schneeforge

      - name: Install Ubuntu WSL2 distribution
        shell: pwsh
        run: |
          wsl --status
          wsl --set-default-version 2
          wsl --install Ubuntu --no-launch --web-download
          wsl -d Ubuntu -- true
          wsl --list --verbose

      - name: Download and execute the pinned Linux installer inside WSL2
        shell: pwsh
        run: |
          $manifest = Get-Content bootstrap-manifest.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $sha = [regex]::Match($manifest, '(?m)^x86_64-linux\s*=\s*"([0-9a-f]{64})"').Groups[1].Value
          if (-not $version -or -not $sha) {
            throw 'Unable to read pinned WSL2 installer version and SHA256'
          }
          wsl -d Ubuntu --cd "$env:GITHUB_WORKSPACE" -- bash ./tests/fixtures/wsl-download-smoke.sh $version $sha
          if ($LASTEXITCODE -ne 0) {
            throw "WSL2 native installer download smoke failed (exit $LASTEXITCODE)"
          }

      - name: Install transport-only helper fixture
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'schneeforge' } | Select-Object -First 1).version
          if (-not $version) {
            throw 'Unable to resolve schneeforge package version'
          }

          wsl -d Ubuntu -- sh -c "printf '%s' '$version' > /tmp/schneeforge-canary-version"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stage canary version (exit $LASTEXITCODE)"
          }

          wsl -d Ubuntu --cd "$env:GITHUB_WORKSPACE" -- install -m 0755 ./tests/fixtures/wsl-canary-helper.sh /usr/local/bin/schneeforge
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install canary helper (exit $LASTEXITCODE)"
          }

          wsl -d Ubuntu --exec schneeforge __backend-info
          if ($LASTEXITCODE -ne 0) {
            throw "Canary helper exec-mode handshake failed (exit $LASTEXITCODE)"
          }

      - name: Explicit selector preserves argv and delegated exit status
        shell: pwsh
        run: |
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Resolve-Path '.\target\debug\schneeforge.exe').Path
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.ArgumentList.Add('--wsl-distro')
          $startInfo.ArgumentList.Add('Ubuntu')
          $startInfo.ArgumentList.Add('canary-transport')
          $startInfo.ArgumentList.Add('a b;$(x)')

          $process = [System.Diagnostics.Process]::Start($startInfo)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $code = $process.ExitCode

          if ($code -ne 23) {
            throw "Expected delegated exit 23, got $code. stdout=[$stdout] stderr=[$stderr]"
          }
          if ($stdout -notmatch [regex]::Escape('canary-argv=a b;$(x)')) {
            throw "Delegated argv payload was not preserved. stdout=[$stdout] stderr=[$stderr]"
          }

      - name: Environment selector reaches the same WSL2 backend
        shell: pwsh
        run: |
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Resolve-Path '.\target\debug\schneeforge.exe').Path
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.Environment['SCHNEEFORGE_WSL_DISTRO'] = 'Ubuntu'
          $startInfo.ArgumentList.Add('canary-transport')
          $startInfo.ArgumentList.Add('a b;$(x)')

          $process = [System.Diagnostics.Process]::Start($startInfo)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $code = $process.ExitCode

          if ($code -ne 23) {
            throw "Expected delegated exit 23 through SCHNEEFORGE_WSL_DISTRO, got $code. stdout=[$stdout] stderr=[$stderr]"
          }
          if ($stdout -notmatch [regex]::Escape('canary-argv=a b;$(x)')) {
            throw "Environment-selected argv payload was not preserved. stdout=[$stdout] stderr=[$stderr]"
          }
