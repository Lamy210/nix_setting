name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: schneeforge-x86_64-linux
          - os: macos-26
            target: aarch64-darwin
            artifact: schneeforge-aarch64-darwin
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          targets: x86_64-unknown-linux-musl

      - name: build binary (musl static, same script as PR CI)
        if: runner.os == 'Linux'
        run: ./scripts/ci/build-release-linux-cli.sh

      - name: package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: macOS / Xcode diagnostics
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: ${{ matrix.xcode }}
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'

      - name: build binary (macOS, same script as PR CI)
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: ${{ matrix.xcode }}
        run: ./scripts/ci/build-release-macos-cli.sh

      - name: package binary (macOS)
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: ${{ matrix.xcode }}
        run: |
          mkdir -p dist
          cp target/release/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-dmg:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-dmg

      - name: macOS / Xcode diagnostics
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: build DMG (host toolchain, same script as PR CI)
        run: ./scripts/ci/build-release-macos-dmg.sh

      - name: upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schneeforge-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-binaries, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: generate SBOM
        run: |
          nix build .#homeConfigurations.linux.activationPackage --no-link
          target="$(nix path-info .#homeConfigurations.linux.activationPackage)"
          nix run nixpkgs#sbomnix -- "$target" --cdx sbom.cdx.json

      - name: generate release metadata (v2 §27)
        run: ./scripts/ci/generate-release-metadata.sh "${{ github.ref_name }}" "${{ github.sha }}"

      - name: generate checksums
        run: |
          {
            echo "# nix_setting ${{ github.ref_name }}"
            echo
            echo "## Binaries"
            sha256sum dist/*/*
            echo
            echo "## SBOM"
            sha256sum sbom.cdx.json
            echo
            echo "## Release metadata"
            sha256sum schneeforge-release.json
            echo
            echo "## flake.lock"
            sha256sum flake.lock
            echo
            echo "## Source"
            echo "revision: ${{ github.sha }}"
          } > CHECKSUMS.txt

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*/*
            sbom.cdx.json
            schneeforge-release.json
            CHECKSUMS.txt

      - name: generate attestation bundles (cosign, platform convention)
        run: |
          ./scripts/ci/attest-release-assets.sh "${{ github.ref_name }}" "${{ github.sha }}" dist/*/*

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*/*
            sbom.cdx.json
            schneeforge-release.json
            CHECKSUMS.txt
            attestations/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
