name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: schneeforge-x86_64-linux
          - os: macos-latest
            target: aarch64-darwin
            artifact: schneeforge-aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # --- Linux (musl static) ---
      # `nix build` 産 binary は ELF interpreter が /nix/store/... 向きになり、
      # Nix 未導入 machine (install.sh の想定環境) で実行できないため、
      # host rustc + musl target で完全 static にする。
      - name: install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          targets: x86_64-unknown-linux-musl

      # build / smoke / static INTERP gate は scripts/ci/ に共通化
      # (PR CI の release-artifact-check と同一 script。drift が rc.2 事故の原因)
      - name: build binary (musl static, same script as PR CI)
        if: runner.os == 'Linux'
        run: ./scripts/ci/build-release-linux-cli.sh

      - name: package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      # --- macOS (host cargo build) ---
      # `nix build` 産 binary は /nix/store の libiconv に link し、
      # Nix 未導入 Mac (install.sh の想定環境) で起動できないため、
      # host toolchain で build する (Linux musl と同じ理由)。
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'

      # build / smoke / otool+LC_RPATH portability gate は scripts/ci/ に共通化
      # (PR CI の release-artifact-check と同一 script。drift が rc.1/rc.2 事故の原因)
      - name: build binary (macOS, same script as PR CI)
        if: runner.os == 'macOS'
        run: ./scripts/ci/build-release-macos-cli.sh

      - name: package binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # DMG も CLI と同じく host cargo + pinned Tauri CLI で build し、mount した
  # .app 内 binary に portability gate をかける (RC.4 の /nix/store libiconv 事故の
  # 再発防止。script は check.yml release-artifact-check と同一)
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-dmg

      # build + gate は scripts/ci/build-release-macos-dmg.sh に共通化
      # (PR CI の release-artifact-check と同一 script。drift が事故原因)
      - name: build DMG (host toolchain, same script as PR CI)
        run: ./scripts/ci/build-release-macos-dmg.sh

      - name: upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schneeforge-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-binaries, build-dmg]
    runs-on: ubuntu-latest
    # job level で上書き: attestation に必要な OIDC (id-token) と
    # attestation 永続化 API の権限 (attestations) は release job のみに
    # 付与する (build job へは渡さない)。attestations: write が無いと
    # "Failed to persist attestation: Resource not accessible by integration"
    # で失敗する (v0.2.0-rc.6 の事故)
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: generate SBOM
        run: |
          nix build .#homeConfigurations.linux.activationPackage --no-link
          target="$(nix path-info .#homeConfigurations.linux.activationPackage)"
          nix run nixpkgs#sbomnix -- "$target" --cdx sbom.cdx.json

      - name: generate release metadata (v2 §27)
        run: ./scripts/ci/generate-release-metadata.sh "${{ github.ref_name }}" "${{ github.sha }}"

      - name: generate checksums
        run: |
          {
            echo "# nix_setting ${{ github.ref_name }}"
            echo
            echo "## Binaries"
            sha256sum dist/*/*
            echo
            echo "## SBOM"
            sha256sum sbom.cdx.json
            echo
            echo "## Release metadata"
            sha256sum schneeforge-release.json
            echo
            echo "## flake.lock"
            sha256sum flake.lock
            echo
            echo "## Source"
            echo "revision: ${{ github.sha }}"
          } > CHECKSUMS.txt

      # Phase E (supply chain): この release の asset 全てに SLSA build
      # provenance を attest する (checksums 生成後・release 作成前。失敗時は
      # release を作らない)。検証は upstream nix-installer と対称の
      # `gh attestation verify --repo Lamy210/nix_setting <file>`。過去
      # release への遡及 attest はしない (design.md D5)
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*/*
            sbom.cdx.json
            schneeforge-release.json
            CHECKSUMS.txt

      # Schnee 配信 platform (SchneeSoftwareDistribution) の命名規約 asset。
      # cosign keyless 署名 (identity = 当 workflow) + SLSA provenance + SPDX
      # SBOM を artifact ごとに生成し、platform と同じ identity pin で自己検証
      # する (失敗時は release を作らない)。GitHub native attestation とは
      # 別経路 (人手の gh attestation verify 用) として併存する
      - name: generate attestation bundles (cosign, platform convention)
        run: |
          ./scripts/ci/attest-release-assets.sh "${{ github.ref_name }}" "${{ github.sha }}" dist/*/*

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*/*
            sbom.cdx.json
            schneeforge-release.json
            CHECKSUMS.txt
            attestations/*
          generate_release_notes: true
          # -rc / -beta tag は prerelease 扱いにし releases/latest API が
          # rc を返さないようにする (install.sh が rc を拾わないようにするため)
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
