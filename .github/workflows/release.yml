name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: schneeforge-x86_64-linux
          - os: macos-latest
            target: aarch64-darwin
            artifact: schneeforge-aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # --- Linux (musl static) ---
      # `nix build` 産 binary は ELF interpreter が /nix/store/... 向きになり、
      # Nix 未導入 machine (install.sh の想定環境) で実行できないため、
      # host rustc + musl target で完全 static にする。
      - name: install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          targets: x86_64-unknown-linux-musl

      - name: build binary (musl static)
        if: runner.os == 'Linux'
        run: cargo build --release -p schneeforge --target x86_64-unknown-linux-musl

      - name: package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      # --- macOS (nix build, libSystem のみ link なので portable) ---
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        if: runner.os == 'macOS'
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: build binary (macOS)
        if: runner.os == 'macOS'
        run: nix build .#schneeforge

      - name: package binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp result/bin/schneeforge "dist/${{ matrix.artifact }}"
          "dist/${{ matrix.artifact }}" --version

      - name: upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: build DMG
        run: nix develop --command cargo tauri build
        working-directory: apps/desktop/src-tauri

      - name: upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schneeforge-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-binaries, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: generate SBOM
        run: |
          nix build .#homeConfigurations.linux.activationPackage --no-link
          target="$(nix path-info .#homeConfigurations.linux.activationPackage)"
          nix run nixpkgs#sbomnix -- "$target" --cdx sbom.cdx.json

      - name: generate checksums
        run: |
          {
            echo "# nix_setting ${{ github.ref_name }}"
            echo
            echo "## Binaries"
            sha256sum dist/*/*
            echo
            echo "## SBOM"
            sha256sum sbom.cdx.json
            echo
            echo "## flake.lock"
            sha256sum flake.lock
            echo
            echo "## Source"
            echo "revision: ${{ github.sha }}"
          } > CHECKSUMS.txt

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*/*
            sbom.cdx.json
            CHECKSUMS.txt
          generate_release_notes: true
          # -rc / -beta tag は prerelease 扱いにし releases/latest API が
          # rc を返さないようにする (install.sh が rc を拾わないようにするため)
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
