name: core-adapter-path-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/core-adapter-path-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Apply core facade and diagnostics migration
        run: python3 .github/scripts/apply-core-adapter-path-migration.py
      - name: Migrate external diagnostics fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/core/tests/diagnostics_home.rs')
          text = path.read_text()
          if 'use std::path::Path;' not in text:
              text = text.replace('use schneeforge_core::{diagnose, ToolInventory};\n', 'use schneeforge_core::{diagnose, ToolInventory};\nuse std::path::Path;\n', 1)
          old = 'Some("/definitely/not/a/real/repo")'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two diagnostics fixture repo strings, got {count}')
          text = text.replace(old, 'Some(Path::new("/definitely/not/a/real/repo"))')
          path.write_text(text)
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify diagnostics and core public boundary
        run: |
          cargo test -p schneeforge-core diagnostics -- --nocapture
          cargo test -p schneeforge-core public_boundary_tests -- --nocapture
          cargo check -p schneeforge-core
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/src/lib.rs crates/core/src/diagnostics.rs crates/core/tests/diagnostics_home.rs
          git commit -m "refactor: keep diagnostics repository paths native"
          git push origin HEAD:refactor/repository-path-identity-implementation
