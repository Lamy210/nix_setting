name: weekly-compat

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  lix-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Lix
        run: |
          curl -sSf -L https://install.lix.systems/lix | sh -s -- install --no-modify-profile
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

      - name: lix flake check
        run: nix flake check --allow-import-from-derivation

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: generate SBOM
        run: |
          nix build .#homeConfigurations.linux.activationPackage --no-link
          nix run nixpkgs#sbomnix -- $(nix path-info .#homeConfigurations.linux.activationPackage) --output sbom.cdx.json
          ls -la sbom.cdx.json
