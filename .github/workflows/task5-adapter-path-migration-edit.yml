name: task5-adapter-path-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/task5-adapter-path-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Verify Task 5 RED
        run: |
          if cargo test -p schneeforge --test repository_non_utf8_repo -- --nocapture; then
            echo "Task 5 RED unexpectedly passed before adapter migration"
            exit 1
          else
            echo "Task 5 RED observed as expected"
          fi
      - name: Apply asserted adapter migration
        run: python3 .github/scripts/apply-task5-adapter-path-migration.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify native CLI repository paths
        run: |
          cargo test -p schneeforge --test repository_non_utf8_repo -- --nocapture
          cargo test -p schneeforge
      - name: Verify Diagnostics and preserved boundaries
        run: |
          cargo test -p schneeforge-core diagnostics -- --nocapture
          cargo test -p schneeforge-core --test managed_nix_escalation_non_utf8_paths -- --nocapture
          cargo test -p schneeforge-core --test windows_backend_contract -- --nocapture
          cargo test -p schneeforge --test windows_cli_contract -- --nocapture
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check desktop adapter in repository CI environment
        run: nix develop --command cargo check --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify Windows backend source unchanged
        run: git diff --exit-code HEAD -- crates/cli/src/windows_backend.rs
      - name: Commit Task 5 and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task5-adapter-path-migration-edit.yml .github/scripts/apply-task5-adapter-path-migration.py
          git add crates/cli/src apps/desktop/src-tauri/src/lib.rs
          git commit -m "refactor: migrate repository path adapters"
          git push origin HEAD:refactor/repository-path-identity-implementation
