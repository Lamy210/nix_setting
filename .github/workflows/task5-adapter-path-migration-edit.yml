# Task 5 diagnostic runner: capture exact Desktop opener context.
name: task5-adapter-path-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/task5-adapter-path-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Verify Task 5 RED
        run: |
          if cargo test -p schneeforge --test repository_non_utf8_repo -- --nocapture; then
            echo "Task 5 RED unexpectedly passed before adapter migration"
            exit 1
          else
            echo "Task 5 RED observed as expected"
          fi
      - name: Capture post-migration Desktop opener context
        run: python3 .github/scripts/apply-task5-adapter-path-migration.py
