name: artifact-download-compatibility

# This non-release canary uploads only synthetic data. It is not a publishing
# workflow and does not replace the required release-artifact-check.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/artifact-download-compatibility.yml'
      - '.github/workflows/release.yml'
      - 'scripts/ci/check-actions-runtime-policy.sh'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/artifact-download-compatibility.yml'
      - '.github/workflows/release.yml'
      - 'scripts/ci/check-actions-runtime-policy.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: create synthetic release-shaped payloads
        run: |
          mkdir -p fixtures
          printf 'linux-fixture\n' > fixtures/schneeforge-x86_64-linux
          printf 'dmg-fixture\n' > fixtures/SchneeForge-fixture.dmg

      - name: upload CLI fixture with release uploader
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-cli
          path: fixtures/schneeforge-x86_64-linux
          if-no-files-found: error
          retention-days: 1

      - name: upload DMG fixture with release uploader
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-dmg
          path: fixtures/SchneeForge-fixture.dmg
          if-no-files-found: error
          retention-days: 1

  verify-artifact-layout:
    needs: produce-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: download all fixtures with release downloader
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          digest-mismatch: error

      - name: verify layout and exact payloads
        run: |
          set -euo pipefail
          cmp dist/compatibility-cli/schneeforge-x86_64-linux <(printf 'linux-fixture\n')
          cmp dist/compatibility-dmg/SchneeForge-fixture.dmg <(printf 'dmg-fixture\n')
          test "$(find dist -type f | wc -l)" -eq 2
          test "$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 2
          echo 'PASS: downloaded artifacts preserve release-shaped layout and payloads'

      # This deliberately tests a missing name, not a corrupt service digest.
      - name: request a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compatibility-intentionally-missing
          path: missing-dist
          digest-mismatch: error

      - name: require missing artifact rejection
        env:
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: test "$MISSING_OUTCOME" = failure
