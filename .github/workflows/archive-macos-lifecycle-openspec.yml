name: archive macOS lifecycle OpenSpec

on:
  push:
    branches:
      - chore/archive-add-macos-managed-nix-lifecycle-canary

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/archive-add-macos-managed-nix-lifecycle-canary
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Archive change with official OpenSpec CLI
        run: nix run nixpkgs#openspec -- archive add-macos-managed-nix-lifecycle-canary --yes

      - name: Validate canonical specs
        run: nix run nixpkgs#openspec -- validate --all --strict --no-interactive

      - name: Commit generated archive
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No archive changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec
          git commit -m "chore(openspec): archive macOS lifecycle acceptance"
          git push origin HEAD:chore/archive-add-macos-managed-nix-lifecycle-canary
