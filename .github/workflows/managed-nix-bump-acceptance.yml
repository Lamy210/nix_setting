name: Managed Nix bump macOS acceptance

on:
  pull_request:
    branches: [develop]
    paths:
      - bootstrap-manifest.toml
      - scripts/ci/macos-managed-nix-lifecycle.sh
      - .github/workflows/managed-nix-bump-acceptance.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-nix-macos-bump:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: macos-managed-nix-bump

      - name: Apple Silicon fresh-host diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          test ! -e /nix
          ! command -v nix

      - name: Build current branch release CLI
        run: ./scripts/ci/build-release-macos-cli.sh

      - name: Validate current branch Managed Nix lifecycle
        env:
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/schneeforge-macos-bump-acceptance-logs
        run: |
          bash scripts/ci/macos-managed-nix-lifecycle.sh \
            --local-binary "$PWD/target/release/schneeforge"

      - name: Upload acceptance logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-managed-nix-bump-${{ github.run_id }}
          path: ${{ runner.temp }}/schneeforge-macos-bump-acceptance-logs
          if-no-files-found: warn
          retention-days: 14
