name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Generate user-options.nix
        run: |
          cat > user-options.nix <<EOF
          {
            username = "$(whoami)";
            homeDirectory = "$HOME";
            system = "$(nix eval --impure --raw --expr 'builtins.currentSystem')";
          }
          EOF

      - name: nix flake check
        run: nix flake check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan for secrets
        run: |
          echo "=== scanning for secrets ==="
          ! grep -RInE "token|password|apikey|api_key|BEGIN.*(OPENSSH|RSA|DSA|EC)|github_pat|ghp_" . \
            --exclude-dir=.git --exclude-dir=.github \
            --exclude=docs/terminal-spec.md

      - name: scan for image files
        run: |
          echo "=== scanning for image files ==="
          ! find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) \
            -not -path './.git/*' | grep .
