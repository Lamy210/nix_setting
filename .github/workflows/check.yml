name: check

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: openspec validate
        run: nix run nixpkgs#openspec -- validate --all --no-interactive

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix flake check
        run: nix flake check --allow-import-from-derivation

      - name: build linux home-manager
        run: nix build .#homeConfigurations.linux.activationPackage

      - name: eval linux-arm home-manager
        run: nix eval .#homeConfigurations.linux-arm.activationPackage.drvPath

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72

      - name: nix flake check
        run: nix flake check --allow-import-from-derivation

      - name: build macos home-manager
        run: nix build .#homeConfigurations.macbook-air.activationPackage

      - name: build nix-darwin system
        run: nix build .#darwinConfigurations.macbook-air.system

      # release.yml の macOS CLI artifact と同一の build 経路を PR CI でも担保する。
      # v0.2.0-rc.2 で「PR CI green なのに release の nix build .#schneeforge が
      # checkPhase で失敗」した coverage gap の再発防止
      - name: build release CLI package (same path as release artifact)
        run: nix build .#schneeforge

      - name: smoke + portability check of release CLI package
        run: |
          ./result/bin/schneeforge --version
          # /nix/store 依存の dylib を持たない (Nix-less machine で動く) こと
          if otool -L result/bin/schneeforge | grep -q '^/nix/store'; then
            echo "::error::release CLI links against /nix/store (not portable)"
            otool -L result/bin/schneeforge
            exit 1
          fi

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker image
        run: docker build -t nix-sandbox .

      - name: nix flake check (Docker)
        run: docker run --rm -v "$PWD:/workspace" nix-sandbox "nix flake check --allow-import-from-derivation"

      - name: nix develop (Docker)
        run: docker run --rm -v "$PWD:/workspace" nix-sandbox "nix develop --command echo 'dev shell ready'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: actionlint
        run: nix run nixpkgs#actionlint

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- bootstrap.sh bench-shell.sh install.sh scripts/resolve-tools.sh tests/managed-nix-e2e.bats tests/install-sh.bats

      - name: statix check
        run: nix run nixpkgs#statix -- check .

      - name: deadnix check
        run: nix run nixpkgs#deadnix -- --fail .

      - name: forbid raw tool spawns
        # tool.rs 以外で Command::new("nix") 等の文字列リテラル spawn を禁止する。
        # 全ての操作は Toolchain の解決済みパスを経由しなければならない。
        # 詳細: openspec/changes/runtime-tool-resolution-hardening/specs/tool-resolution/spec.md
        # 例外: tool.rs (resolver 本体), crates/cli/tests/ (テストヘルパ)
        run: |
          set -euo pipefail
          # Rust 側: tool.rs と CLI テストヘルパ以外で文字列リテラル spawn を使っていないか検出
          # コメント行（// で始まるか /// doc comment、行内 /* ... */ ）は除外
          # 仕様: tool-resolution spec "文字列リテラル spawn の禁止"
          rust_hits=$(grep -rnE 'Command::new\("(nix|git|brew|nh)"|run_(capture|stream)\("(nix|git|brew|nh)"|command_succeeds\("(nix|git|brew|nh)"' crates apps 2>/dev/null \
            | grep -v 'crates/core/src/tool.rs' \
            | grep -v 'crates/cli/tests/' \
            | grep -v '^Binary file' \
            | grep -vE ':\s*(///?|\*).*Command::new' \
            | grep -vE ':\s*///' \
            | grep -vE ':\s*/\*.*Command::new' \
            | grep -vE '/\*.*Command::new\("\{0,1\}(nix|git|brew|nh)' \
            || true)
          if [ -n "$rust_hits" ]; then
            echo "ERROR: raw tool spawns detected. Use Toolchain instead." >&2
            echo "$rust_hits" >&2
            exit 1
          fi
          # shell 側: install.sh / bootstrap.sh で直接 nix/git/brew を呼んでいないか
          # [$] を使うことで shellcheck SC2016 を回避しつつ $NIX_BIN リテラルを grep
          # `schneeforge ... nix install` は CLI subcommand 引数 (tool spawn ではない) のため除外
          shell_hits=$(grep -nE '(^| )nix |(^| )git |(^| )brew ' install.sh bootstrap.sh 2>/dev/null \
            | grep -v '^#' \
            | grep -v '[$]NIX_BIN' \
            | grep -v '[$]GIT_BIN' \
            | grep -v '[$]BREW_BIN' \
            | grep -v 'nix install' \
            || true)
          if [ -n "$shell_hits" ]; then
            echo "ERROR: raw tool invocations in shell. Use [$]NIX_BIN / [$]GIT_BIN / [$]BREW_BIN (resolve-tools.sh)." >&2
            echo "$shell_hits" >&2
            exit 1
          fi
          echo "OK: no raw tool spawns"

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo test
        run: nix develop --command cargo test

      - name: cargo fmt check
        run: nix develop --command cargo fmt -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: CLI artifact smoke
        run: |
          nix develop --command cargo build --release -p schneeforge
          ./target/release/schneeforge --version
          ./target/release/schneeforge doctor

      - name: desktop build smoke
        run: nix develop --command cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

  bootstrap-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: bats test (bootstrap)
        run: nix run nixpkgs#bats -- tests/bootstrap.bats

      - name: bats test (install.sh Managed Nix 経路)
        run: nix run nixpkgs#bats -- tests/install-sh.bats

      - name: bats test (resolve-tools)
        run: nix run nixpkgs#bats -- tests/resolve-tools.bats

      # pin 済み nix-installer 実 binary との invocation contract 検証
      # (install <plan> positional / SHA256 pin / --plan long flag 不在)
      - name: bats test (managed-nix contract)
        run: nix run nixpkgs#bats -- tests/managed-nix-contract.bats

      - name: nix-unit test
        run: nix run nixpkgs#nix-unit -- tests/nix-unit.nix

  # issue #14: Linux x86_64 Docker E2E smoke。Nix-less Ubuntu container で
  # schneeforge CLI の install → doctor → uninstall full flow を検証する。
  # host 側 bats が docker CLI を叩く (DinD 不要)。
  #
  # binary は release.yml と同じ musl static build を使う。「CI で build できる」
  # と「release binary が Nix-less machine で動く」は別物だったため (v0.2.0-rc.1
  # の Linux asset が /nix/store interpreter 向きで exit 127)、E2E が検証する
  # binary を release artifact と同一構成に固定する。
  managed-nix-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: install musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: build schneeforge (release, musl static)
        run: cargo build --release -p schneeforge --target x86_64-unknown-linux-musl

      # musl static であることの gate: INTERP (dynamic interpreter) を持たないこと
      - name: verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/schneeforge
          if readelf -l target/x86_64-unknown-linux-musl/release/schneeforge | grep -q INTERP; then
            echo "ERROR: binary is dynamically linked" >&2
            exit 1
          fi
          echo "OK: fully static binary"

      - name: stage binary at target/release
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/schneeforge target/release/schneeforge

      - name: bats test (managed-nix E2E, Docker)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          bats tests/managed-nix-e2e.bats

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: trufflehog scan
        run: nix run nixpkgs#trufflehog -- filesystem . --only-verified

      - name: scan for image files
        run: |
          echo "=== scanning for image files ==="
          ! find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) \
            -not -path './.git/*' \
            -not -path './apps/desktop/src-tauri/icons/*' | grep .

  devshell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: default devShell
        run: nix develop --command echo "maintenance shell ready"

      - name: runtime smoke (named shells)
        run: |
          nix develop .#go --command bash -c 'command -v go && go version'
          nix develop .#python --command bash -c 'command -v python3 && python3 --version'
          nix develop .#node --command bash -c 'command -v node && node --version'
          nix develop .#rust --command bash -c 'command -v rustc && rustc --version && command -v cargo && cargo --version'

  template-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [devenv, node, python, rust, flutter]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: ${{ matrix.template }} template validate
        run: |
          cp -r "templates/${{ matrix.template }}" /tmp/template-test
          cd /tmp/template-test && nix flake metadata --json > /dev/null

      - name: ${{ matrix.template }} devShell
        if: matrix.template != 'devenv'
        run: |
          cp -r "templates/${{ matrix.template }}" /tmp/template-dev
          cd /tmp/template-dev && nix develop --command true
