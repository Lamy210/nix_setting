name: check

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: openspec validate (strict)
        run: nix run nixpkgs#openspec -- validate --all --strict --no-interactive

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix flake check
        run: nix flake check --allow-import-from-derivation

      # Preserve evaluation coverage for the product default (developer) profile,
      # but do not realize its entire upstream package closure on every PR.
      - name: eval default developer linux home-manager
        run: nix eval .#homeConfigurations.linux.activationPackage.drvPath

      - name: build minimal linux home-manager
        run: nix build .#homeConfigurations.linux.activationPackage --override-input profile "path:$PWD/tests/fixtures/profile-minimal.nix"

      - name: eval linux-arm home-manager
        run: nix eval .#homeConfigurations.linux-arm.activationPackage.drvPath

  macos-stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
          - os: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: macOS / Xcode diagnostics
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: nix flake check
        run: nix flake check --allow-import-from-derivation

      - name: build macos home-manager
        run: nix build .#homeConfigurations.darwin-aarch64.activationPackage

      - name: build nix-darwin system
        run: nix build .#darwinConfigurations.darwin-aarch64.system

  macos-check:
    needs: [macos-stable]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: require stable macOS matrix
        env:
          MACOS_STABLE: ${{ needs.macos-stable.result }}
        run: |
          set -euo pipefail
          printf 'macos-stable=%s\n' "$MACOS_STABLE"
          if [ "$MACOS_STABLE" != "success" ]; then
            echo "ERROR: stable macOS matrix did not succeed" >&2
            exit 1
          fi

  # release artifact を tag push 後に初めて build しない原則。
  # release workflow と同一の scripts/ci/*.sh で build し smoke する
  # macOS release artifacts 全部 (CLI + DMG) を release workflow と同一 script で
  # build し gate する。DMG は RC.4 まで nix build 経路のまま /nix/store link が
  # 検出されず release されていたため、ここで完成品検査まで回す
  release-artifact-check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: macOS / Xcode diagnostics
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: build + smoke + portability gate (same script as release workflow)
        run: ./scripts/ci/build-release-macos-cli.sh

      - name: build DMG + mounted-app portability gate (same script as release workflow)
        run: ./scripts/ci/build-release-macos-dmg.sh

      # Release Metadata (v2 §27): 生成 script を dummy tag (stable/preview
      # 両方) で実行し、生成と自己検証が通ることを PR 時点で保証する
      # (release workflow と同一 script)
      - name: verify release metadata generator (same script as release workflow)
        run: |
          ./scripts/ci/generate-release-metadata.sh v9.9.9-rc.9 0123456789abcdef0123456789abcdef01234567 /tmp/rel-meta-preview.json
          ./scripts/ci/generate-release-metadata.sh v9.9.9 0123456789abcdef0123456789abcdef01234567 /tmp/rel-meta-stable.json

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker image
        run: docker build -t nix-sandbox .

      - name: nix flake check (Docker)
        run: docker run --rm -v "$PWD:/workspace" nix-sandbox "nix flake check --allow-import-from-derivation"

      - name: nix develop (Docker)
        run: docker run --rm -v "$PWD:/workspace" nix-sandbox "nix develop --command echo 'dev shell ready'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: actionlint
        run: nix run nixpkgs#actionlint

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- bootstrap.sh bench-shell.sh install.sh scripts/resolve-tools.sh scripts/ci/build-release-macos-cli.sh scripts/ci/build-release-linux-cli.sh scripts/ci/build-release-macos-dmg.sh scripts/ci/check-macos-portability.sh scripts/ci/attest-release-assets.sh tests/managed-nix-e2e.bats tests/install-sh.bats tests/ci-scripts.bats

      - name: statix check
        run: nix run nixpkgs#statix -- check .

      - name: deadnix check
        run: nix run nixpkgs#deadnix -- --fail .

      - name: forbid raw tool spawns
        run: |
          set -euo pipefail
          rust_hits=$(grep -rnE 'Command::new\("(nix|git|brew|nh)"|run_(capture|stream)\("(nix|git|brew|nh)"|command_succeeds\("(nix|git|brew|nh)"' crates apps 2>/dev/null \
            | grep -v 'crates/core/src/tool.rs' \
            | grep -v 'crates/cli/tests/' \
            | grep -v '^Binary file' \
            | grep -vE ':\s*(///?|\*).*Command::new' \
            | grep -vE ':\s*///' \
            | grep -vE ':\s*/\*.*Command::new' \
            | grep -vE '/\*.*Command::new\("\{0,1\}(nix|git|brew|nh)' \
            || true)
          if [ -n "$rust_hits" ]; then
            echo "ERROR: raw tool spawns detected. Use Toolchain instead." >&2
            echo "$rust_hits" >&2
            exit 1
          fi
          shell_hits=$(grep -nE '(^| )nix |(^| )git |(^| )brew ' install.sh bootstrap.sh 2>/dev/null \
            | grep -v '^#' \
            | grep -v '[$]NIX_BIN' \
            | grep -v '[$]GIT_BIN' \
            | grep -v '[$]BREW_BIN' \
            | grep -v 'nix install' \
            || true)
          if [ -n "$shell_hits" ]; then
            echo "ERROR: raw tool invocations in shell. Use [$]NIX_BIN / [$]GIT_BIN / [$]BREW_BIN (resolve-tools.sh)." >&2
            echo "$shell_hits" >&2
            exit 1
          fi
          echo "OK: no raw tool spawns"

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: cargo test
        run: nix develop --command cargo test -- --test-threads=1
      - name: cargo fmt check
        run: nix develop --command cargo fmt -- --check
      - name: cargo clippy
        run: nix develop --command cargo clippy -- -D warnings

  rust-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: CLI artifact smoke
        run: |
          nix develop --command cargo build --release -p schneeforge
          ./target/release/schneeforge --version
          ./target/release/schneeforge doctor
      - name: desktop compile smoke
        run: nix develop --command cargo check --release --manifest-path apps/desktop/src-tauri/Cargo.toml

  rust-check:
    needs: [rust-quality, rust-build-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: require all Rust workers
        env:
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          RUST_BUILD_SMOKE: ${{ needs.rust-build-smoke.result }}
        run: |
          set -euo pipefail
          printf 'rust-quality=%s\n' "$RUST_QUALITY"
          printf 'rust-build-smoke=%s\n' "$RUST_BUILD_SMOKE"
          for result in "$RUST_QUALITY" "$RUST_BUILD_SMOKE"; do
            if [ "$result" != "success" ]; then
              echo "ERROR: a Rust CI worker did not succeed" >&2
              exit 1
            fi
          done

  bootstrap-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: bats test (bootstrap)
        run: nix run nixpkgs#bats -- tests/bootstrap.bats
      - name: bats test (install.sh Managed Nix 経路)
        run: nix run nixpkgs#bats -- tests/install-sh.bats
      - name: bats test (resolve-tools)
        run: nix run nixpkgs#bats -- tests/resolve-tools.bats
      - name: bats test (source update dispatch)
        run: |
          nix develop --command cargo build --release -p schneeforge
          nix run nixpkgs#bats -- tests/source-update.bats
      - name: bats test (ci-scripts gate patterns)
        run: nix run nixpkgs#bats -- tests/ci-scripts.bats
      - name: bats test (managed-nix contract)
        run: nix run nixpkgs#bats -- tests/managed-nix-contract.bats
      - name: nix-unit test
        run: nix run nixpkgs#nix-unit -- tests/nix-unit.nix

  managed-nix-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: build schneeforge (release, musl static, same script as release workflow)
        run: ./scripts/ci/build-release-linux-cli.sh
      - name: stage binary at target/release
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/schneeforge target/release/schneeforge
      - name: bats test (managed-nix E2E, Docker)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          bats tests/managed-nix-e2e.bats

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: trufflehog scan
        run: nix run nixpkgs#trufflehog -- filesystem . --only-verified
      - name: scan for image files
        run: |
          echo "=== scanning for image files ==="
          ! find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) \
            -not -path './.git/*' \
            -not -path './apps/desktop/src-tauri/icons/*' | grep .

  devshell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: default devShell
        run: nix develop --command echo "maintenance shell ready"
      - name: runtime smoke (named shells)
        run: |
          nix develop .#go --command bash -c 'command -v go && go version'
          nix develop .#python --command bash -c 'command -v python3 && python3 --version'
          nix develop .#node --command bash -c 'command -v node && node --version'
          nix develop .#rust --command bash -c 'command -v rustc && rustc --version && command -v cargo && cargo --version'

  template-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [devenv, node, python, rust, flutter]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: ${{ matrix.template }} template validate
        run: |
          cp -r "templates/${{ matrix.template }}" /tmp/template-test
          cd /tmp/template-test && nix flake metadata --json > /dev/null
      - name: ${{ matrix.template }} devShell
        if: matrix.template != 'devenv'
        run: |
          cp -r "templates/${{ matrix.template }}" /tmp/template-dev
          cd /tmp/template-dev && nix develop --command true

  ci-required:
    needs:
      - openspec-check
      - flake-check
      - rust-check
      - lint
      - bootstrap-test
      - managed-nix-e2e
      - release-artifact-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: require all current required checks
        env:
          OPENSPEC_CHECK: ${{ needs.openspec-check.result }}
          FLAKE_CHECK: ${{ needs.flake-check.result }}
          RUST_CHECK: ${{ needs.rust-check.result }}
          LINT: ${{ needs.lint.result }}
          BOOTSTRAP_TEST: ${{ needs.bootstrap-test.result }}
          MANAGED_NIX_E2E: ${{ needs.managed-nix-e2e.result }}
          RELEASE_ARTIFACT_CHECK: ${{ needs.release-artifact-check.result }}
        run: |
          set -euo pipefail
          printf 'openspec-check=%s\n' "$OPENSPEC_CHECK"
          printf 'flake-check=%s\n' "$FLAKE_CHECK"
          printf 'rust-check=%s\n' "$RUST_CHECK"
          printf 'lint=%s\n' "$LINT"
          printf 'bootstrap-test=%s\n' "$BOOTSTRAP_TEST"
          printf 'managed-nix-e2e=%s\n' "$MANAGED_NIX_E2E"
          printf 'release-artifact-check=%s\n' "$RELEASE_ARTIFACT_CHECK"
          for result in \
            "$OPENSPEC_CHECK" \
            "$FLAKE_CHECK" \
            "$RUST_CHECK" \
            "$LINT" \
            "$BOOTSTRAP_TEST" \
            "$MANAGED_NIX_E2E" \
            "$RELEASE_ARTIFACT_CHECK"; do
            if [ "$result" != "success" ]; then
              echo "ERROR: a required CI job did not succeed" >&2
              exit 1
            fi
          done
