name: tdd-diagnostics-relative-xdg

on:
  push:
    branches: ["fix/diagnostics-relative-xdg-state-home"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: run diagnostics relative XDG regression
        run: >-
          nix develop --command cargo test -p schneeforge-core
          --test diagnostics_xdg_state
          relative_xdg_state_home_falls_back_to_absolute_home
          -- --exact --nocapture
