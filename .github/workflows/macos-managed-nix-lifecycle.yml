name: macOS Managed Nix lifecycle acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
        type: string
        default: v0.2.0-rc.7

permissions:
  contents: read

concurrency:
  group: macos-managed-nix-lifecycle-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  managed-nix-lifecycle:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apple Silicon fresh-host diagnostics
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          test ! -e /nix
          ! command -v nix

      - name: Validate release Managed Nix lifecycle
        env:
          ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/schneeforge-macos-lifecycle-logs
        run: bash scripts/ci/macos-managed-nix-lifecycle.sh "${{ inputs.tag }}"

      - name: Upload acceptance logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-managed-nix-lifecycle-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/schneeforge-macos-lifecycle-logs
          if-no-files-found: warn
          retention-days: 14
