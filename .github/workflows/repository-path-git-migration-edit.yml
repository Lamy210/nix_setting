name: repository-path-git-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/repository-path-git-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Prepare migration assertions
        run: |
          sed -i 's/count != 1/count != (2 if label == "sync native args #1" else 1)/' .github/scripts/apply-repository-path-git-migration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-repository-path-git-migration.py')
          text = path.read_text()
          text = text.replace(
              'if "repo: &str" in prod:\n    raise SystemExit("production operations.rs still contains repo: &str")',
              'if prod.count("repo: &str") != 1 or "#[cfg(test)]\\nfn sync_args(repo: &str)" not in prod:\n    raise SystemExit("unexpected production repo: &str boundary remains")',
          )
          text = text.replace(
              'if "repo.to_string()" in prod:\n    raise SystemExit("production operations.rs still stringifies a repository path")',
              'if prod.count("repo.to_string()") != 1:\n    raise SystemExit("unexpected repository path stringification remains")',
          )
          path.write_text(text)
          PY
      - name: Apply asserted Git path migration edits
        run: python3 .github/scripts/apply-repository-path-git-migration.py
      - name: Migrate current git revision API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/core/src/repo.rs')
          text = path.read_text()
          old = '''/// 移行中の String-based compatibility entry point。
          /// in-repo caller の path migration 完了後に削除する。
          pub fn current_git_revision(repo: &str, git_bin: &Path) -> Option<String> {
              current_git_revision_path(Path::new(repo), git_bin)
          }
          '''
          new = '''/// repository path から現在の git revision (HEAD) を取得する。
          /// migration 中は `&str` caller も `AsRef<Path>` 経由で受けるが、内部では
          /// OS-native path identity を保ったまま `current_dir` へ渡す。
          pub fn current_git_revision<P: AsRef<Path> + ?Sized>(
              repo: &P,
              git_bin: &Path,
          ) -> Option<String> {
              current_git_revision_path(repo.as_ref(), git_bin)
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('current_git_revision compatibility block changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove obsolete captured String action helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/core/src/actions.rs')
          text = path.read_text()

          def remove_section(start_marker: str, end_marker: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker not found: {end_marker!r}')
              text = text[:start] + text[end:]

          remove_section(
              '#[cfg(test)]\npub(crate) fn apply_captured(',
              '/// Linux: activationPackage を build して activate する (nh 非依存)',
          )
          remove_section(
              '#[cfg(test)]\nfn apply_linux_captured(',
              '/// macOS rollback の引数',
          )
          remove_section(
              '#[cfg(test)]\npub(crate) fn rollback_captured(',
              '/// upgrade の引数を構築する',
          )
          remove_section(
              '#[cfg(test)]\npub(crate) fn upgrade_captured(',
              '/// scan: 環境スキャン結果を文字列で返す。',
          )
          path.write_text(text)
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify core tests
        run: cargo test -p schneeforge-core
      - name: Verify core clippy
        run: cargo clippy -p schneeforge-core --all-targets -- -D warnings -A clippy::chunks-exact-to-as-chunks
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/src crates/core/tests
          git commit -m "refactor: preserve repository paths in Git operations"
          git push origin HEAD:refactor/repository-path-identity-implementation
