name: Linux real configuration apply E2E

# Invoked from the always-running check workflow; avoid path-filtered required checks.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-apply-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: real-apply-linux
      - name: Build actual SchneeForge CLI
        run: cargo build --release --locked -p schneeforge
      - name: Apply Home Manager config and verify actual files and tools
        id: apply-e2e
        run: bash tests/apply/linux-apply-e2e.sh
      - name: Report test boundaries
        if: ${{ always() }}
        env:
          APPLY_E2E_OUTCOME: ${{ steps.apply-e2e.outcome }}
        run: |
          if [[ "$APPLY_E2E_OUTCOME" == success ]]; then
            echo 'Linux x86_64: plan/apply/verify/reapply and A→B→A generation rollback verified on a disposable runner.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Linux x86_64: apply/rollback acceptance did not pass; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Fresh Nix installation and other OS application are not proven by this job.' >> "$GITHUB_STEP_SUMMARY"
