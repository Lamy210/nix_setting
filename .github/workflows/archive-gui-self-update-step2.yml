name: archive GUI self-update Step 2 OpenSpec

on:
  push:
    branches:
      - chore/archive-add-gui-self-update-step2
    paths:
      - .github/workflows/archive-gui-self-update-step2.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/archive-add-gui-self-update-step2

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Archive change with official OpenSpec CLI
        run: nix run nixpkgs#openspec -- archive add-gui-self-update-step2 --yes

      - name: Validate canonical specs
        run: nix run nixpkgs#openspec -- validate --all --strict --no-interactive

      - name: Commit generated archive and canonical spec sync
        run: |
          git config user.name "schneeforge-openspec-bot"
          git config user.email "actions@users.noreply.github.com"
          git add openspec
          if git diff --cached --quiet; then
            echo "No OpenSpec archive changes generated" >&2
            exit 1
          fi
          git commit -m "chore(openspec): archive GUI self-update Step 2"
          git push origin HEAD:chore/archive-add-gui-self-update-step2
