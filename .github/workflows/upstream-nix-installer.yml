# .github/workflows/upstream-nix-installer.yml
#
# design.md D3 の "Release bump CI":
#   1. NixOS/nix-installer の最新 release tag を取得
#   2. `gh attestation verify` で SLSA provenance を検証
#   3. release の SHA256SUMS を取得し、対象 arch の expected sha256 を抽出
#   4. bootstrap-manifest.toml を更新する PR を自動作成
#
# 重要な設計要件 (design.md D3):
#   - **bump PR は即時 merge ではなく、SchneeForge release cycle で評価** する。
#     breaking change (CLI flag 廃止・receipt schema 変更等) がある場合は棄却。
#   - SLSA provenance 検証失敗時は CI fail + `gh issue create` で tracked-issue 自動起票。
#   - 利用者 PC 側は pinned SHA256 の比較のみで保護される (gh / cosign 不要)。

name: upstream-nix-installer

on:
  schedule:
    # 毎週月曜 03:17 UTC (round-hour pill を避けるため :17)
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific nix-installer tag to bump to (e.g. 2.35.2). Empty = latest.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MANIFEST_PATH: bootstrap-manifest.toml

jobs:
  track-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve target version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            # pre-release は除外して latest stable を取得
            latest=$(gh release list \
              --repo NixOS/nix-installer \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')
            # tagName は "v2.35.1" 形式と "2.35.1" 形式が混在するので "v" を取り除く
            latest="${latest#v}"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version is already pinned
        id: check
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          current=$(awk -F'"' '/^version *= */ {print $2}' "$MANIFEST_PATH")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$TARGET_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Early exit if already pinned
        if: steps.check.outputs.skip == 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        run: echo "Manifest already at ${TARGET_VERSION}. Nothing to do."

      - name: Fetch SHA256SUMS
        if: steps.check.outputs.skip != 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -o SHA256SUMS \
            "https://github.com/NixOS/nix-installer/releases/download/${TARGET_VERSION}/SHA256SUMS"
          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"

      - name: Download assets + verify SLSA provenance
        if: steps.check.outputs.skip != 'true'
        id: slsa
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          fail_open=0
          for asset in nix-installer-x86_64-linux nix-installer-aarch64-linux nix-installer-aarch64-darwin; do
            url="https://github.com/NixOS/nix-installer/releases/download/${TARGET_VERSION}/${asset}"
            echo "::group::download $asset"
            curl -fsSL --retry 3 --retry-delay 5 -o "assets/$asset" "$url"
            echo "::endgroup::"
            # gh attestation verify は file path を要求する (URL は不可)
            if gh attestation verify "assets/$asset" \
                --repo NixOS/nix-installer \
                --predicate-type https://slsa.dev/provenance/v1; then
              echo "  ✓ $asset: SLSA provenance OK"
            else
              echo "  ✗ $asset: SLSA provenance verification FAILED"
              fail_open=1
            fi
            # SLSA verified binary の actual SHA256 を SHA256SUMS と cross-check し、
            # 「検証した binary」と「manifest に書く hash」が同一物であることを保証する。
            # match はちょうど 1 行でなければならない (0 = asset 無し、2+ = SUMS 破損)
            expected=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS | tr 'A-F' 'a-f')
            match_count=$(awk -v a="$asset" '$2 == a' SHA256SUMS | wc -l)
            if [ "$match_count" -ne 1 ] || [ -z "$expected" ]; then
              echo "::error::$asset found $match_count entries in SHA256SUMS (expected 1)"
              fail_open=1
              continue
            fi
            actual=$(sha256sum "assets/$asset" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$asset SHA256 mismatch: asset=$actual sums=$expected"
              fail_open=1
            fi
          done
          if [ "$fail_open" -ne 0 ]; then
            echo "slsa_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "slsa_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on SLSA failure
        if: steps.slsa.outputs.slsa_failed == 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'Release [%s](https://github.com/NixOS/nix-installer/releases/tag/%s) の SLSA provenance 検証が失敗しました。\n\n' "$TARGET_VERSION" "$TARGET_VERSION"
            printf -- '- workflow run: %s\n' "$WORKFLOW_URL"
            printf -- '- 対象 asset: x86_64-linux / aarch64-linux / aarch64-darwin\n\n'
            printf '手動で原因確認 (workflow run log / upstream SLSA source) を行い、\n'
            printf '上流に問題がある場合は bump を棄却、上流復旧後に再実行してください。\n'
          } > /tmp/issue-body.md
          gh issue create \
            --title "upstream nix-installer ${TARGET_VERSION}: SLSA provenance verification failed" \
            --body-file /tmp/issue-body.md

      - name: Fail job on SLSA failure (do not bump)
        if: steps.slsa.outputs.slsa_failed == 'true'
        run: |
          echo "SLSA provenance 検証が失敗したため bump を中断します (design.md D3)。"
          exit 1

      - name: Update bootstrap-manifest.toml
        if: steps.slsa.outputs.slsa_failed != 'true' && steps.check.outputs.skip != 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # x86_64-linux, aarch64-linux, aarch64-darwin の sha256 を SHA256SUMS から抽出
          declare -A arch_to_asset=(
            [x86_64-linux]=nix-installer-x86_64-linux
            [aarch64-linux]=nix-installer-aarch64-linux
            [aarch64-darwin]=nix-installer-aarch64-darwin
          )

          {
            printf '[managed_nix]\n'
            printf 'version = "%s"\n\n' "$TARGET_VERSION"
            printf '[managed_nix.sha256_by_arch]\n'
            for arch in x86_64-linux aarch64-linux aarch64-darwin; do
              asset="${arch_to_asset[$arch]}"
              sha=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS | tr 'A-F' 'a-f')
              count=$(awk -v a="$asset" '$2 == a' SHA256SUMS | wc -l)
              if [ "$count" -ne 1 ] || [ -z "$sha" ]; then
                echo "::error::sha256 for $asset: found $count entries in SHA256SUMS (expected 1)"
                exit 1
              fi
              printf '%s = "%s"\n' "$arch" "$sha"
            done
          } > "$MANIFEST_PATH"
          echo "::group::Updated manifest"
          cat "$MANIFEST_PATH"
          echo "::endgroup::"

      - name: Create or update bump PR
        if: steps.slsa.outputs.slsa_failed != 'true' && steps.check.outputs.skip != 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="bump/nix-installer-${TARGET_VERSION}"
          git config user.name "schneeforge-bump-bot"
          git config user.email "actions@users.noreply.github.com"

          # 同 version の再実行時は branch が既存。reset して上書き。
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch already exists; resetting to base"
            git fetch origin develop
            git checkout -B "$branch" origin/develop
          else
            git checkout -b "$branch"
          fi

          git add "$MANIFEST_PATH"
          {
            printf 'bump(nix-installer): %s\n\n' "$TARGET_VERSION"
            printf 'SLSA provenance verified via gh attestation verify.\n'
            printf 'SHA256SUMS fetched from upstream release %s.\n\n' "$TARGET_VERSION"
            printf 'This bump was created automatically by upstream-nix-installer workflow.\n'
            printf 'Evaluate before merge per design.md D3 (release-cycle, not latest-tracking).\n\n'
            printf 'Source: %s\n' "$WORKFLOW_URL"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # 再実行時は上書きが必要なので force-with-lease
          git push --force-with-lease origin "$branch"

          {
            printf '## Summary\n'
            printf -- '- bootstrap-manifest.toml を nix-installer v%s へ bump\n' "$TARGET_VERSION"
            printf -- '- SLSA provenance 検証済み (gh attestation verify)\n'
            printf -- '- SHA256SUMS は upstream release から取得\n\n'
            printf '## Merge criteria (design.md D3)\n'
            printf -- '- [ ] breaking change 無し (CLI flag / receipt schema)\n'
            printf -- '- [ ] Linux x86_64 smoke test 通過\n'
            printf -- '- [ ] macOS aarch64 smoke test 通過 (ADR-0001 Final acceptance)\n'
            printf -- '- [ ] SchneeForge release cycle 上で評価済み\n\n'
            printf '自動生成元: [workflow run](%s)\n' "$WORKFLOW_URL"
          } > /tmp/pr-body.md

          # 既存 PR があれば更新、無ければ作成
          existing_pr=$(gh pr list --head "$branch" --base develop --json number --jq '.[0].number' || true)
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body-file /tmp/pr-body.md
            echo "Updated existing PR #$existing_pr"
          else
            gh pr create \
              --base develop \
              --head "$branch" \
              --title "bump(nix-installer): ${TARGET_VERSION}" \
              --body-file /tmp/pr-body.md
          fi
