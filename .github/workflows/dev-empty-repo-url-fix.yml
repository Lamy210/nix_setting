name: dev-empty-repo-url-fix

on:
  push:
    branches: [fix/empty-repo-url-fallback]
    paths:
      - .github/workflows/dev-empty-repo-url-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/empty-repo-url-fallback

      - name: Confirm regression is red
        run: |
          if cargo test -p schneeforge-core --test repo_url_contract empty_repository_url_override_falls_back_to_default; then
            echo "expected empty repository URL regression test to fail before implementation" >&2
            exit 1
          fi

      - name: Apply canonical repository URL fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              file.write_text(text.replace(old, new))

          replace(
              "crates/core/src/source.rs",
              '''pub fn repo_url() -> String {
              std::env::var("SCHNEEFORGE_REPO_URL")
                  .unwrap_or_else(|_| crate::bootstrap::DEFAULT_REPO_URL.to_string())
          }
          ''',
              '''pub fn repo_url() -> String {
              std::env::var("SCHNEEFORGE_REPO_URL")
                  .ok()
                  .filter(|value| !value.is_empty())
                  .unwrap_or_else(|| crate::bootstrap::DEFAULT_REPO_URL.to_string())
          }
          ''',
          )

          replace(
              "crates/core/src/bootstrap.rs",
              '''    let effective_url = if url.trim().is_empty() {
                  std::env::var("SCHNEEFORGE_REPO_URL").unwrap_or_else(|_| DEFAULT_REPO_URL.to_string())
              } else {
          ''',
              '''    let effective_url = if url.trim().is_empty() {
                  crate::source::repo_url()
              } else {
          ''',
          )

          replace(
              "apps/desktop/src-tauri/src/lib.rs",
              '''    detect_target, release_page_url, resolve_repo, scan, Diagnostics, Error, Manifest,
              PreflightReport, StateStore, ToolInventory, VerifyReport, DEFAULT_REPO_URL,
          ''',
              '''    detect_target, release_page_url, repo_url, resolve_repo, scan, Diagnostics, Error, Manifest,
              PreflightReport, StateStore, ToolInventory, VerifyReport,
          ''',
          )

          replace(
              "apps/desktop/src-tauri/src/lib.rs",
              '''        let repo_url =
                      std::env::var("SCHNEEFORGE_REPO_URL").unwrap_or_else(|_| DEFAULT_REPO_URL.to_string());
          ''',
              '''        let repo_url = repo_url();
          ''',
          )

          replace(
              "apps/desktop/src-tauri/src/lib.rs",
              '''    let repo_url =
                  std::env::var("SCHNEEFORGE_REPO_URL").unwrap_or_else(|_| DEFAULT_REPO_URL.to_string());
          ''',
              '''    let repo_url = repo_url();
          ''',
          )
          PY

      - name: Format and verify regression
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test -p schneeforge-core --test repo_url_contract empty_repository_url_override_falls_back_to_default
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/src/source.rs crates/core/src/bootstrap.rs apps/desktop/src-tauri/src/lib.rs
          git commit -m "fix: ignore empty repository URL override"
          git push origin HEAD:fix/empty-repo-url-fallback
