name: Managed Nix distribution download acceptance

# Invoked from the always-running check workflow; avoid path-filtered required checks.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-download-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  download-verify-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject Python syntax warnings
        run: python3 -W error::SyntaxWarning -m py_compile tests/distribution/validate_assets.py
      - name: Verify failure injection for truncated/corrupted downloads
        run: python3 tests/distribution/validate_assets.py --self-test
      - name: Download and verify complete assets for Linux x64/ARM64 and macOS ARM64
        run: python3 tests/distribution/validate_assets.py --manifest bootstrap-manifest.toml --out distribution-report --native-help-smoke
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-download-verification-${{ github.run_id }}
          path: distribution-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          if [[ -f distribution-report/summary.md ]]; then
            cat distribution-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FAIL: 一部の配布物が完全取得・検証できていません。' >> "$GITHUB_STEP_SUMMARY"
          fi
