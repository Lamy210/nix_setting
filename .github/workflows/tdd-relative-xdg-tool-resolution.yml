name: tdd-relative-xdg-tool-resolution

on:
  push:
    branches: ["fix/ignore-relative-xdg-tool-resolution"]

permissions:
  contents: read

jobs:
  rust-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: run Rust relative XDG resolver regression
        run: nix develop --command cargo test -p schneeforge-core --test tool_relative_xdg -- --nocapture

  shell-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: run shell relative XDG resolver regressions
        run: nix run nixpkgs#bats -- tests/resolve-tools.bats
