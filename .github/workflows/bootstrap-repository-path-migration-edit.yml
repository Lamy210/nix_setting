name: bootstrap-repository-path-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/bootstrap-repository-path-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Apply asserted bootstrap path migration
        run: python3 .github/scripts/apply-bootstrap-repository-path-migration.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify bootstrap and core path tests
        run: |
          cargo test -p schneeforge-core bootstrap::tests
          cargo test -p schneeforge-core --test repository_non_utf8_filesystem
          cargo test -p schneeforge-core --test repository_non_utf8_process_args
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/src/bootstrap.rs
          git commit -m "refactor: preserve repository clone destination paths"
          git push origin HEAD:refactor/repository-path-identity-implementation
