name: temp update desktop lock

on:
  push:
    branches: [feat/gui-self-update-step2]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/gui-self-update-step2

      - uses: dtolnay/rust-toolchain@stable

      - name: resolve desktop dependencies
        run: cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: commit desktop lockfile
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/Cargo.lock; then
            echo "desktop Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(desktop): update updater dependency lock"
          git push origin HEAD:feat/gui-self-update-step2
