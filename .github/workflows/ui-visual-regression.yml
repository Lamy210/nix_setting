name: UI visual regression

# Invoked from the always-running check workflow; avoid path-filtered required checks.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          persist-credentials: false

      - name: Checkout baseline revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'develop' }}
          path: baseline
          persist-credentials: false

      - name: Install pinned image comparison dependencies
        run: python -m pip install --disable-pip-version-check -r candidate/tests/ui/requirements.txt

      - name: UI behavior tests (no privileged operations)
        run: >-
          python candidate/tests/ui/visual_regression.py
          --mode behavior
          --candidate candidate/apps/desktop/dist
          --out ui-visual-artifacts

      - name: Capture base, PR, and highlighted image diff
        run: >-
          python candidate/tests/ui/visual_regression.py
          --mode compare
          --baseline baseline/apps/desktop/dist
          --candidate candidate/apps/desktop/dist
          --out ui-visual-artifacts

      - name: Upload all full-page screenshots (including zero-difference scenes)
        id: images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schneeforge-ui-visual-${{ github.run_id }}
          path: ui-visual-artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Add visual diff to job summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.images.outputs.artifact-url }}
        run: |
          if [ -f ui-visual-artifacts/summary.md ]; then
            {
              cat ui-visual-artifacts/summary.md
              echo '全画面のbefore/after/diff PNGは差分ゼロでも保存・検証されます。'
              printf '\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'UIテストまたは画面の取得に失敗したため、差分を生成できませんでした。' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '[変更前・変更後・差分PNGを確認](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
