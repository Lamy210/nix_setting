name: repository-path-migration-edit

on:
  push:
    branches:
      - refactor/repository-path-identity-implementation
    paths:
      - .github/workflows/repository-path-migration-edit.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refactor/repository-path-identity-implementation
          fetch-depth: 0
      - name: Apply asserted migration edits
        run: python3 .github/scripts/apply-repository-path-migration.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/core/src crates/core/tests
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "refactor: route core operations through native repository paths"
          git push origin HEAD:refactor/repository-path-identity-implementation
