name: archive-dmg-licensing-once

on:
  push:
    branches: [chore/archive-add-dmg-offline-bundle-licensing]
    paths:
      - .github/workflows/archive-dmg-licensing-once.yml

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/archive-add-dmg-offline-bundle-licensing
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: archive OpenSpec change with canonical spec sync
        run: nix run nixpkgs#openspec -- archive add-dmg-offline-bundle-licensing --yes

      - name: validate archived result
        run: nix run nixpkgs#openspec -- validate --all --strict --no-interactive

      - name: commit generated archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openspec
          git diff --cached --exit-code && { echo 'archive command produced no changes'; exit 1; }
          git commit -m 'chore(openspec): archive DMG offline bundle licensing'
          git push origin HEAD:chore/archive-add-dmg-offline-bundle-licensing
