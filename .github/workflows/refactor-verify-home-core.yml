name: Apply verify HOME core refactor

on:
  push:
    branches:
      - refactor/verify-home-path-core
    paths:
      - .github/workflows/refactor-verify-home-core.yml

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/verify-home-path-core
          fetch-depth: 1

      - name: Apply guarded source refactor
        shell: python
        run: |
          from pathlib import Path

          operations = Path("crates/core/src/operations.rs")
          source = operations.read_text()
          old = '''    let home = std::env::var("HOME").unwrap_or_default();
              for (name, path) in [
                  (".zshrc", format!("{home}/.zshrc")),
                  (".gitconfig", format!("{home}/.gitconfig")),
                  ("starship.toml", format!("{home}/.config/starship.toml")),
              ] {
                  checks.push(VerifyCheck {
                      name: name.to_string(),
                      ok: std::path::Path::new(&path).exists(),
                  });
              }
          '''
          new = '''    let home = std::env::var_os("HOME")
                  .filter(|home| !home.is_empty())
                  .map(std::path::PathBuf::from)
                  .filter(|home| home.is_absolute());
              for (name, relative) in [
                  (".zshrc", ".zshrc"),
                  (".gitconfig", ".gitconfig"),
                  ("starship.toml", ".config/starship.toml"),
              ] {
                  checks.push(VerifyCheck {
                      name: name.to_string(),
                      ok: home
                          .as_ref()
                          .is_some_and(|home| home.join(relative).exists()),
                  });
              }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"operations.rs replacement count: {source.count(old)}")
          operations.write_text(source.replace(old, new, 1))

          lib = Path("crates/core/src/lib.rs")
          source = lib.read_text()
          old = '''    /// Public verification boundary.
              ///
              /// `HOME` is an implicit filesystem root, so it is usable only when it is a
              /// non-empty absolute OS path. Re-evaluate HOME-derived dotfile checks here in
              /// `PathBuf` space so valid non-UTF-8 filesystem identities are preserved while
              /// empty or relative HOME values remain fail-closed and CWD-independent.
              pub fn verify(
                  repo: &str,
                  tc: &crate::tool::ToolInventory,
              ) -> crate::operations_impl::VerifyReport {
                  let mut report = crate::operations_impl::verify(repo, tc);
                  let home = std::env::var_os("HOME")
                      .filter(|home| !home.is_empty())
                      .map(std::path::PathBuf::from)
                      .filter(|home| home.is_absolute());
          
                  for check in &mut report.checks {
                      let relative = match check.name.as_str() {
                          ".zshrc" => Some(".zshrc"),
                          ".gitconfig" => Some(".gitconfig"),
                          "starship.toml" => Some(".config/starship.toml"),
                          _ => None,
                      };
                      if let Some(relative) = relative {
                          check.ok = home
                              .as_ref()
                              .is_some_and(|home| home.join(relative).exists());
                      }
                  }
          
                  report
              }
          '''
          new = '''    /// Public verification boundary.
              ///
              /// HOME-derived filesystem checks live in the core operation so every caller
              /// shares the same OS-native path identity and fail-closed semantics.
              pub fn verify(
                  repo: &str,
                  tc: &crate::tool::ToolInventory,
              ) -> crate::operations_impl::VerifyReport {
                  crate::operations_impl::verify(repo, tc)
              }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"lib.rs replacement count: {source.count(old)}")
          lib.write_text(source.replace(old, new, 1))

          workflow = Path(".github/workflows/refactor-verify-home-core.yml")
          workflow.unlink()

      - name: Verify diff shape
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/refactor-verify-home-core.yml crates/core/src/lib.rs crates/core/src/operations.rs "

      - name: Commit refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize verify HOME path handling"
          git push origin HEAD:refactor/verify-home-path-core
