[[verbs]]
invocation = "edit"
key = "F2"
shortcut = "e"
execution = "$EDITOR {file}"
leave_broot = false

[[verbs]]
invocation = "create {subpath}"
key = "F3"
shortcut = "c"
execution = "$EDITOR {directory}/{subpath}"
leave_broot = false

[[verbs]]
invocation = "git_diff"
key = "F4"
shortcut = "gd"
execution = "lazygit"
leave_broot = false
apply_to = "directory"

[[verbs]]
invocation = "terminal"
key = "ctrl-t"
shortcut = ":t"
execution = "$SHELL"
leave_broot = false
apply_to = "directory"

[[verbs]]
invocation = "toggle_hidden"
key = "alt-h"
shortcut = "h"
execution = ":toggle_hidden"

