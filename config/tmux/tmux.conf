set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g history-limit 50000

set -g mouse on

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"

bind -r p previous-window
bind -r n next-window

bind x kill-pane
bind X kill-window

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g status-position bottom
set -g status-justify left
set -g status-left-length 32
set -g status-right-length 80
set -g status-interval 5

set -g status-left "#[fg=#CBEAF7] #S "
set -g status-right "#[fg=#91A4BD] #H | %Y-%m-%d %H:%M "

set -g status-style "bg=#101827,fg=#EAF6FF"
set -g window-status-format "#[fg=#52657D] #I #W "
set -g window-status-current-format "#[fg=#8CC4F5,bold] #I #W "
set -g window-status-separator ""

set -g pane-active-border-style "fg=#8CC4F5"
set -g pane-border-style "fg=#2F3E63"

set -g message-style "bg=#263B5B,fg=#CBEAF7"

setw -g window-style "bg=#101827"
setw -g window-active-style "bg=#101827"

set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off
